<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คู่มือการทำงาน · MASARU Facebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy:#1A2942; --navy-2:#24365A; --red:#D0212B; --fb:#1877F2; --gold:#C9A84C;
  --bg:#F3F5F9; --card:#FFFFFF; --line:#E3E8F0; --line-2:#EEF1F6;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --muted-2:#94A3B8;
  --good:#15803d; --good-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2; --info-bg:#E0ECFF;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
  --side:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--fb);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
.num,.tnum{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
/* ---------- shell ---------- */
.fb-side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.fb-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.fb-logo{width:36px;height:36px;border-radius:9px;background:var(--fb);display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;flex:none}
.fb-brand b{display:block;font-size:15px;letter-spacing:.3px}
.fb-brand small{display:block;color:#AFC0DA;font-size:11.5px}
.fb-nav{flex:1;overflow:auto;padding:8px 8px 16px}
.fb-nav .grp{color:#8FA3C4;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:14px 10px 6px}
.fb-nav a{display:flex;align-items:center;gap:10px;color:#DCE5F3;padding:8px 10px;border-radius:8px;font-size:14px;text-decoration:none}
.fb-nav a:hover{background:rgba(255,255,255,.07)}
.fb-nav a.on{background:rgba(24,119,242,.22);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--fb)}
.fb-nav a .ic{width:22px;text-align:center;font-size:16px}
.fb-nav a .soon{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:99px;color:#C9D6EA}
.fb-side-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#AFC0DA}
.fb-main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.fb-top{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;min-height:58px}
.fb-top h1{font-size:19px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.fb-top .sub{color:var(--muted);font-size:13px}
.fb-top .sp{flex:1}
.fb-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.fb-burger{display:none;border:0;background:transparent;font-size:22px;cursor:pointer;padding:4px 6px}
.fb-content{padding:18px 22px 40px;flex:1}
.fb-foot{padding:14px 22px;color:var(--muted-2);font-size:12px;border-top:1px solid var(--line)}
@media (max-width:980px){
  .fb-side{transform:translateX(-100%)} body.nav-open .fb-side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .fb-main{margin-left:0} .fb-burger{display:block} .fb-content{padding:14px 14px 40px} .fb-top{padding:8px 14px}
}
/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:15.5px;font-weight:700;color:var(--navy)}
.card-h .hint{color:var(--muted);font-size:12.5px}
.card-h .sp{flex:1}
.card-b{padding:6px 16px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){.g5,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4,.g5,.g6{grid-template-columns:minmax(0,1fr)}.g6.keep2,.g4.keep2,.g5.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#F6F8FB;border-color:#CBD5E1;text-decoration:none}
.btn.pri{background:var(--fb);border-color:var(--fb);color:#fff}.btn.pri:hover{background:#0F66D8}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn.navy:hover{background:var(--navy-2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:#E9EEF5}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid #CFD8E3;background:#fff;border-radius:8px;padding:7px 10px;outline:none;min-width:0}
.inp:focus{border-color:var(--fb);box-shadow:0 0 0 3px rgba(24,119,242,.15)}
textarea.inp{resize:vertical;min-height:70px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
label.f .inp{font-weight:400;color:var(--ink);font-size:14px}
.seg{display:inline-flex;background:#E7ECF3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--fb)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF2F7;color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.sel{border-color:var(--fb);background:var(--info-bg);color:#0B4FB3}
.chip.tog{cursor:pointer;user-select:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;color:#fff;font-weight:700;flex:none;border:2px solid #fff}
.av.lg{width:40px;height:40px;font-size:19px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.st-good{background:var(--good-bg);color:var(--good)} .st-warn{background:var(--warn-bg);color:var(--warn)} .st-bad{background:var(--bad-bg);color:var(--bad)} .st-none{background:#EEF2F7;color:var(--muted)}
/* tiles */
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .lb{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .v{font-size:25px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.bar{height:10px;background:#E7ECF3;border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--fb);border-radius:99px}
.bar.tall{height:16px}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{background:#F6F8FB;color:var(--ink-2);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:#FAFBFD}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .c{text-align:center}
table.t tfoot td{font-weight:800;background:#F6F8FB;border-top:1px solid var(--line)}
table.t th.sort{cursor:pointer} table.t th.sort:hover{color:var(--fb)}
table.t input.inp{padding:4px 7px;width:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .15s ease-out}
.modal.wide{max-width:900px}.modal.xwide{max-width:1180px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16.5px;color:var(--navy)}
.modal-b{padding:16px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#FAFBFD;border-radius:0 0 14px 14px}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
#fb-toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
#fb-toast div{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;max-width:360px;animation:pop .15s}
#fb-toast div.err{background:var(--bad)} #fb-toast div.ok{background:var(--good)}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid #CBD5E1;border-top-color:var(--fb);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:220px}.chart-box.lg{height:360px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px}
.note{background:var(--info-bg);border:1px solid #C7DBFF;color:#123A7A;border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);border-color:#FCD98A;color:#7A4A06}
.drop{border:2px dashed #C3CEDD;border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:#FAFBFD}
.drop:hover,.drop.over{border-color:var(--fb);background:var(--info-bg);color:#0B4FB3}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#EEF2F7;border-radius:5px;padding:1px 6px;font-size:12px}
@media print{.fb-side,.fb-top,.no-print{display:none!important}.fb-main{margin:0}.card{box-shadow:none}}
@media (max-width:860px){.grid[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:760px){.fb-top .sub{display:none}.fb-top h1{font-size:16.5px;white-space:nowrap}.fb-user>span{display:none}.tile .v{font-size:21px}.card-h{padding:12px 12px 8px}.card-b{padding:6px 12px 12px}}

/* ===== page ===== */
.man{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto;padding:12px}
.toc .ch{display:flex;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);align-items:flex-start}
.toc .ch:hover{background:#F2F5F9}
.toc .ch.on{background:var(--info-bg);color:#0B4FB3;font-weight:700}
.toc .ch .n{min-width:24px;height:22px;border-radius:6px;background:#EEF2F7;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.toc .ch.on .n{background:var(--fb);color:#fff}
.toc .subs{margin:2px 0 6px 32px;border-left:2px solid var(--line);padding-left:8px}
.toc .subs a{display:block;font-size:12.5px;color:var(--muted);padding:3px 4px;text-decoration:none;border-radius:5px}
.toc .subs a:hover{color:var(--fb);background:#F6F8FB}
.toc .grp{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.5px;margin:12px 8px 4px;text-transform:uppercase}
.doc{padding:26px 34px 34px;min-height:70vh}
.doc-h{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.doc-h .num{font-size:14px;font-weight:800;color:#fff;background:var(--navy);border-radius:10px;padding:6px 11px}
.doc-h h2{font-size:24px;color:var(--navy)}
.art{font-size:15.5px;line-height:1.75;color:#1E293B;max-width:860px}
.art h3{font-size:18.5px;color:var(--navy);margin:26px 0 10px;padding-top:6px;border-top:1px dashed var(--line)}
.art h4{font-size:16px;color:var(--navy-2);margin:18px 0 8px}
.art p{margin:8px 0}
.art img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:8px 0;cursor:zoom-in;box-shadow:var(--shadow)}
.art blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--fb);background:#F6F9FF;border-radius:0 10px 10px 0}
.art table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
.art td,.art th{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
.art th{background:#F6F8FB}
.art ul,.art ol{padding-left:24px}
.art .lead{font-size:16px;background:var(--info-bg);border-radius:10px;padding:10px 14px}
.art .tag{font-size:11.5px;background:#EEF2F7;border-radius:5px;padding:1px 6px;color:var(--muted);font-weight:700;white-space:nowrap}
.art mark{background:#FFE58F;padding:0 2px;border-radius:3px}
.art[contenteditable=true]{outline:2px dashed #93C5FD;outline-offset:8px;border-radius:6px}
.tb{position:sticky;top:64px;z-index:5;display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)}
.res{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-2)}
.res:hover{background:#F2F5F9}.res b{color:var(--navy)}.res .sn{color:var(--muted);font-size:12px}
.lbx{position:fixed;inset:0;background:rgba(10,15,25,.85);z-index:95;display:grid;place-items:center;cursor:zoom-out;padding:20px}
.lbx img{max-width:96vw;max-height:92vh;border-radius:8px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
.rel{margin-top:26px;background:#FAFBFD;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
@media (max-width:980px){.man{grid-template-columns:1fr}.toc{position:static;max-height:none}.doc{padding:18px}}
@media print{.toc,.tb,.nav2,.rel,.doc-h .btn{display:none!important}.man{display:block}.doc{border:0;box-shadow:none;padding:0}}
</style>
<style id="masaru-social-studio">
/* MASARU · Social Studio — presentation layer, self-contained */
:root{--navy:#203a62;--navy-2:#304e77;--fb:#2672e9;--bg:#f5f7fc;--line:#e3eaf5;--line-2:#eef2f8;--muted:#65758d;--muted-2:#76859b;--ink:#243650;--ink-2:#435772;--radius:18px;--shadow:0 3px 15px rgba(38,63,109,.035);--side:248px}
body{background:radial-gradient(ellipse at 96% 0%,#eaf0ff 0,transparent 40%),var(--bg);line-height:1.6}
::selection{background:#d8e8ff;color:#19345b}
:focus-visible{outline:3px solid #377fea;outline-offset:3px}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,.btn,.fb-nav a,.menu-card,.kc{transition:background .18s,border-color .18s,box-shadow .18s,transform .18s}
.fb-side{background:#fff;color:var(--ink);border-right:1px solid var(--line)}
.fb-brand{padding:25px 18px 23px;gap:11px;border-bottom:1px solid var(--line-2)}
.fb-brand b{font-size:13px;letter-spacing:.35px;color:var(--navy)}
.fb-brand small{color:var(--muted);font-size:11px;margin-top:3px}
.fb-logo{width:40px;height:44px;border-radius:14px;background:linear-gradient(145deg,#438df7,#2465d9);font-family:Arial,sans-serif;font-size:32px;box-shadow:0 5px 12px #2778ec24}
.fb-nav{padding:8px 12px 16px;scrollbar-width:thin;scrollbar-color:#d6e0ef transparent}
.fb-nav .grp{padding:19px 12px 7px;color:#7b8a9f;font-size:10px;letter-spacing:1.4px}
.fb-nav a{color:#53647c;min-height:43px;padding:9px 12px;border-radius:12px;margin:2px 0;font-size:13px;gap:10px}
.fb-nav a .ic{font-size:17px;transition:transform .2s;filter:saturate(.8)}
.fb-nav a:hover{background:#f2f6fd;color:#2466cf}
.fb-nav a:hover .ic{transform:translateY(-2px) rotate(-7deg)}
.fb-nav a.on{background:#eaf2ff;color:#2466cf;box-shadow:none;font-weight:700}
.fb-nav a.on:after{content:'';width:6px;height:6px;border-radius:50%;background:#2672e9;margin-left:auto;flex:none}
.fb-nav a .soon{background:#f0f2f7;color:#68758b;font-size:9px}
.fb-side-foot{border-top:1px solid var(--line);color:var(--muted);padding:18px 22px;font-size:11px;background:linear-gradient(120deg,#f5f8ff,#fff)}
.fb-top{background:#ffffffdf;backdrop-filter:blur(16px);padding:14px 28px;min-height:76px;gap:16px}
.fb-top h1{font-size:18px;letter-spacing:-.35px;flex-shrink:0}
.fb-top .sub{font-size:11.5px;max-width:40%;color:#76849a}
.fb-user{padding:4px 5px 4px 8px;border-radius:12px;background:#f5f7fc;flex-shrink:0;font-size:12px}
.fb-content{padding:24px 28px 40px;min-width:0}
.fb-main{min-width:0}.fb-foot{font-size:11px;border-top:0}
.card{border-color:var(--line);box-shadow:var(--shadow)}
.card-h{padding:19px 20px 13px}.card-h h2,.card-h h3{font-size:15px}.card-b{padding:4px 20px 20px}
.card-h .hint{font-size:11px}.grid{gap:16px}.mt{margin-top:18px}
.btn{border-radius:10px;min-height:37px;padding:8px 14px;font-size:12.5px}
.btn:hover{border-color:#b8cdea;background:#f2f6ff;box-shadow:0 3px 8px #18325409}

function isoOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

  $$('[data-cmd]').forEach(b => b.onmousedown = e => { e.preventDefault(); const c = b.dataset.cmd;
    if (['h3', 'h4', 'p', 'blockquote'].includes(c)) document.execCommand('formatBlock', false, c);
    else if (c === 'link') { const u = prompt('ลิงก์ (https://...)'); if (u) document.execCommand('createLink', false, u); }
    else if (c === 'img') pickImage();
    else document.execCommand(c, false, null); });
  $('#eCancel').onclick = () => { EDIT = false; open(CUR.id); };
  $('#eSave').onclick = async () => {
    const html = unresolve($('#art')).replace(/<mark>(.*?)<\/mark>/g, '$1');
    const title = $('#dTitle').textContent.trim() || CUR.title;
    const tags = $('#eTags').value.split(',').map(s => s.trim()).filter(Boolean);
    chk(await sb.from('fb_manual').update({ html, title, tags, updated_at: new Date().toISOString(), updated_by: FB.profile.display_name }).eq('id', CUR.id), 'บันทึกคู่มือ');
    Object.assign(CUR, { html, title, tags, updated_at: new Date().toISOString(), updated_by: FB.profile.display_name, _t: plain(html).toLowerCase() });
    EDIT = false; toast('บันทึกคู่มือแล้ว', 'ok'); open(CUR.id);
  };
  $('#eDel').onclick = async () => { if (!await confirmBox(`ลบบทที่ ${CUR.chapter} “${esc(CUR.title)}” ถาวร?`, 'ลบ', true)) return; chk(await sb.from('fb_manual').delete().eq('id', CUR.id), 'ลบ'); EDIT = false; CH = CH.filter(c => c.id !== CUR.id); CUR = null; renderToc(); CH[0] ? open(CH[0].id) : ($('#doc').innerHTML = ''); };
}
function pickImage() {
  const sel = window.getSelection(); const range = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; toast('กำลังอัปโหลดรูป...');
    const blob = await shrink(f, 1100);
    const path = `manual/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.webp`;
    const { error } = await sb.storage.from('fb-files').upload(path, blob, { contentType: 'image/webp', upsert: false });
    if (error) return toast('อัปโหลดไม่สำเร็จ: ' + error.message, 'err');
    const url = sb.storage.from('fb-files').getPublicUrl(path).data.publicUrl;
    $('#art').focus(); if (range) { sel.removeAllRanges(); sel.addRange(range); }
    document.execCommand('insertHTML', false, `<p><img src="${url}" loading="lazy"></p>`); toast('แทรกรูปแล้ว', 'ok');
  };
  inp.click();
}
function shrink(file, maxW) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const s = Math.min(1, maxW / img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b || file), 'image/webp', .8); }; img.onerror = () => res(file); img.src = URL.createObjectURL(file); });
}
$('#bAdd').onclick = () => {
  const nx = Math.max(0, ...CH.map(c => c.chapter)) + 1;
  const md = openModal({ title: '➕ เพิ่มบท / SOP ใหม่', body: `<div class="grid g2"><label class="f">เลขบท<input class="inp" id="nN" value="${nx}"></label><label class="f">ชื่อบท<input class="inp" id="nT" placeholder="เช่น SOP การปิดแอดที่ %ค่าแอดสูง"></label></div><label class="f mt">แท็ก (คั่นด้วย ,)<input class="inp" id="nG"></label>`, foot: '<button class="btn pri" id="nS">สร้างแล้วเริ่มเขียน</button>' });
  md.querySelector('#nS').onclick = async () => { const t = md.querySelector('#nT').value.trim(); if (!t) return toast('กรอกชื่อบท', 'err'); const n = +md.querySelector('#nN').value || nx; const d = chk(await sb.from('fb_manual').insert({ chapter: n, title: t, html: '<p>เริ่มเขียนเนื้อหาที่นี่...</p>', tags: md.querySelector('#nG').value.split(',').map(s => s.trim()).filter(Boolean), sort: n * 10, updated_by: FB.profile.display_name }).select().single(), 'สร้างบท'); md.close(); d._t = ''; CH.push(d); CH.sort((a, b) => a.sort - b.sort || a.chapter - b.chapter); open(d.id); startEdit(); };
};
window.addEventListener('beforeunload', e => { if (EDIT) { e.preventDefault(); e.returnValue = ''; } });
fbBoot('manual').then(load);
</script>
<script id="studio-interactions">
(()=>{
 const passToggle=document.getElementById('studioPassToggle');
 if(passToggle)passToggle.addEventListener('click',()=>{const p=document.getElementById('aPass');const show=p.type==='password';p.type=show?'text':'password';passToggle.textContent=show?'ซ่อน':'แสดง';passToggle.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน');passToggle.setAttribute('aria-pressed',String(show));});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open')){document.body.classList.remove('nav-open');document.querySelector('.fb-burger')?.focus();}});
 const syncNav=()=>{const b=document.querySelector('.fb-burger');if(b){b.setAttribute('aria-expanded',String(document.body.classList.contains('nav-open')));}document.querySelector('.fb-nav a.on')?.setAttribute('aria-current','page');};
 new MutationObserver(syncNav).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true});syncNav();
})();
</script>
